# Supabase Configuration File
# Learn more: https://supabase.com/docs/reference/cli/config

[project]
# Project ID extracted from SUPABASE_URL
project_id = "wwmctqhbqpsbkyxkeaqv"

[api]
enabled = true
port = 54321
# Schemas to expose via REST API
schemas = ["public", "storage", "graphql_public"]
# Extra search path for API requests
extra_search_path = ["public"]
# Maximum rows returned by a single request
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
port = 54323
ip_version = "IPv4"

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
port = 54321
file_size_limit = "50MiB"

[auth]
enabled = true
port = 54321
site_url = "http://127.0.0.1:54323"
additional_redirect_urls = ["https://127.0.0.1:54323"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
port = 54321

[analytics]
enabled = false
port = 54327
backend = "postgres"
